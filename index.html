<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Prelancer Studios</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;700&display=swap" rel="stylesheet">

<style>
/* --- Reset --- */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* --- Background Grid --- */
body {
    font-family: 'Inter', sans-serif;
    color: #e6f1ff;
    height: 100vh;
    overflow: hidden;
    background: #05070d;
}

/* Animated grid */
body::before {
    content: "";
    position: absolute;
    width: 200%;
    height: 200%;
    background-image:
        linear-gradient(rgba(0, 255, 255, 0.05) 1px, transparent 1px),
        linear-gradient(to right, rgba(0, 255, 255, 0.05) 1px, transparent 1px);
    background-size: 60px 60px;
    animation: moveGrid 20s linear infinite;
}

@keyframes moveGrid {
    from { transform: translate(0, 0); }
    to { transform: translate(-60px, -60px); }
}

/* --- Center Container --- */
.container {
    position: relative;
    z-index: 2;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
}

/* --- Glass Panel --- */
.panel {
    backdrop-filter: blur(20px);
    background: rgba(10, 15, 25, 0.7);
    border: 1px solid rgba(0, 255, 255, 0.15);
    padding: 60px;
    text-align: center;
    border-radius: 16px;
    box-shadow: 0 0 40px rgba(0, 255, 255, 0.08);
    max-width: 700px;
}

/* --- Title --- */
h1 {
    font-size: 2.8rem;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 15px;
}

/* --- Tagline --- */
.tagline {
    font-size: 1.2rem;
    color: #00e0ff;
    margin-bottom: 20px;
}

/* --- Description --- */
.desc {
    font-size: 1rem;
    line-height: 1.6;
    opacity: 0.8;
    margin-bottom: 40px;
}

/* --- Nav Buttons --- */
.nav {
    display: flex;
    gap: 15px;
    justify-content: center;
    flex-wrap: wrap;
}

.nav a {
    padding: 10px 20px;
    border: 1px solid rgba(0, 255, 255, 0.3);
    border-radius: 8px;
    text-decoration: none;
    color: #e6f1ff;
    transition: 0.25s ease;
    font-size: 0.9rem;
}

.nav a:hover {
    background: rgba(0, 255, 255, 0.1);
    border-color: #00e0ff;
    box-shadow: 0 0 10px rgba(0, 255, 255, 0.3);
}

/* --- Footer Note --- */
.footer {
    position: absolute;
    bottom: 20px;
    width: 100%;
    text-align: center;
    font-size: 0.8rem;
    opacity: 0.5;
}
</style>
</head>

<body>

<div class="container">
    <div class="panel">
        <h1>Prelancer Studios</h1>

        <div class="tagline">Making games the rad way.</div>

        <div class="desc">
            Prelancer Studios is an indie team driven by creativity and innovation.
            <br>
            We build games. We build experiences. We build fun.
        </div>

        <div class="nav">
            <a href="#">Projects</a>
            <a href="#">About</a>
            <a href="#">Careers</a>
            <a href="mailto:contact@prelancerstudios.com">Contact</a>
        </div>
    </div>
</div>

<div class="footer">
    © 2026 Prelancer Studios
</div>

</body>
</html>
